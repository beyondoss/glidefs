name: drain-probe
on:
  pull_request:
    branches: ["main"]
    paths: [".github/workflows/drain-probe.yml"]
jobs:
  drain:
    name: drain loop (patch=${{ matrix.patch }}, ${{ matrix.transport }})
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        patch: ["yes", "no"]
        transport: ["user-copy", "zero-copy"]
    env:
      GLIDEFS_FORCE_USER_COPY: ${{ matrix.transport == 'user-copy' && '1' || '' }}
      GLIDEFS_TEST_FORCE_USER_COPY: ${{ matrix.transport == 'user-copy' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: "drain-probe"
      - name: Install fio
        run: |
          sudo apt-get update
          sudo apt-get install -y fio
          sudo apt-get install -y linux-modules-extra-$(uname -r) || true
      - name: Binary-patch ublk_drv.ko (work around 1015 ublk_init_queues NULL deref)
        # See blktests job for full bug analysis. Drop when 1016+ ships.
        if: matrix.patch == 'yes'
        run: |
          uname -r
          KO_SRC="/lib/modules/$(uname -r)/kernel/drivers/block/ublk_drv.ko.zst"
          if [ ! -f "$KO_SRC" ]; then
            # The patch is for 6.17.0-1015's ublk_drv only; a kernel with ublk elsewhere
            # (built in, another path or compression) is not affected.
            echo "module not at $KO_SRC — kernel not affected, skipping"
            modinfo ublk_drv || true
            exit 0
          fi
          sudo rmmod ublk_drv 2>/dev/null || true
          sudo zstd -d --force "$KO_SRC" -o /tmp/ublk_drv.ko
          sudo chown $(id -u):$(id -g) /tmp/ublk_drv.ko
          python3 - <<'PY'
          import re, sys
          PATH = "/tmp/ublk_drv.ko"
          MAGIC = b"~Module signature appended~\n"
          def strip_sig(buf):
              # Patching the body invalidates the module's appended signature.
              # A module whose signature is present-but-invalid is rejected with
              # EKEYREJECTED even when enforcement is OFF (module_sig_check
              # returns the verify error unconditionally for bad sigs; only a
              # *missing* sig is tolerated). The runner has sig_enforce=N and no
              # lockdown, so strip the now-stale sig and the kernel loads the
              # unsigned patched module (tainted, fine for CI).
              if bytes(buf[-len(MAGIC):]) != MAGIC:
                  print("no appended signature to strip", file=sys.stderr)
                  return buf
              # sig_len is the last be32 of the 12-byte struct module_signature,
              # which sits immediately before MAGIC.
              sig_len = int.from_bytes(buf[-len(MAGIC)-4:-len(MAGIC)], "big")
              total = sig_len + 12 + len(MAGIC)
              del buf[-total:]
              print(f"stripped module signature ({total} bytes)", file=sys.stderr)
              return buf
          data = bytearray(open(PATH, "rb").read())
          matches = list(re.finditer(b'\x39\xf0\x72\xd6', bytes(data)))
          if len(matches) == 0:
              print("buggy pattern not present — kernel not affected, skipping", file=sys.stderr)
              sys.exit(0)
          if len(matches) > 1:
              nop_pattern = list(re.finditer(b'\x39\xf0\x90\x90', bytes(data)))
              if nop_pattern:
                  print("module already patched — skipping", file=sys.stderr)
                  sys.exit(0)
              print(f"ambiguous: {len(matches)} matches of 39 f0 72 d6", file=sys.stderr)
              sys.exit(1)
          off = matches[0].start() + 2
          data[off:off+2] = b'\x90\x90'
          data = strip_sig(data)
          open(PATH, "wb").write(bytes(data))
          print(f"patched offset {hex(off)}")
          PY
          sudo zstd --force /tmp/ublk_drv.ko -o "$KO_SRC"
          sudo depmod -a
      - name: Load ublk
        run: |
          uname -r; sudo modprobe ublk_drv; ls -l /dev/ublk-control
          sudo sh -c 'cat /sys/module/ublk_drv/srcversion; cat /sys/module/ublk_drv/taint 2>/dev/null' || true
      - name: Build
        run: sudo -E env "PATH=$PATH" cargo test -p glidefs --features ublk,docker-tests --test docker_integration --no-run 2>&1 | tail -3
      - name: Loop the drain durability test
        run: |
          B=$(ls -t target/debug/deps/docker_integration-* | grep -v '\.d$' | head -1)
          fail=0
          for i in $(seq 1 40); do
            sudo -E env "PATH=$PATH" $B test_drain_during_active_writes_ublk 2>&1 | tee /tmp/run.$i.log | grep -q "1 passed" || { fail=$((fail+1)); echo "run $i FAILED"; grep -E "panicked|should contain" /tmp/run.$i.log | head -3; }
          done
          echo "RESULT patch=${{ matrix.patch }} transport=${{ matrix.transport }} failures=$fail/40"
          [ "$fail" = 0 ]
