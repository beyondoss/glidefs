name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glidefs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: "clippy"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Run clippy
        run: cargo clippy --features test-utils --tests --benches

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glidefs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Run all tests
        run: cargo test --features test-utils --verbose

  docker-integration:
    name: Docker Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glidefs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Run docker integration tests
        run: cargo test --features docker-tests --test docker_integration --verbose

  loom:
    name: Loom Concurrency Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glidefs/loom-tests
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "glidefs/loom-tests -> target"
      - name: Run loom tests
        run: cargo test --release

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glidefs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Run benchmarks
        run: cargo bench --features test-utils --benches

  kernel-devices:
    name: Kernel Devices (Linux)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: glidefs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: "clippy"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install kernel modules + fio
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-modules-extra-$(uname -r) fio
      - name: Clippy (ublk)
        run: cargo clippy --features ublk,test-utils --tests --benches
      - name: Load kernel modules
        run: |
          sudo modprobe nbd || echo "nbd not available — nbd kernel tests will skip"
          sudo modprobe ublk_drv || echo "ublk_drv not available — ublk tests will skip"
      - name: fio benchmark (ublk)
        run: sudo -E env "PATH=$PATH" cargo test --features fio-bench --test fio_bench -- --nocapture
      - name: Test (ublk)
        run: cargo test --features ublk,test-utils --verbose
      - name: Docker integration (ublk)
        run: sudo -E env "PATH=$PATH" cargo test --features ublk,docker-tests --test docker_integration ublk --verbose
