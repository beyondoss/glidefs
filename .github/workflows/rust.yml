name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: "clippy"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Clippy (ext4, oci-registry, oci-distribution)
        run: cargo clippy -p ext4 -p oci-registry -p oci-distribution --tests
      - name: Clippy (glidefs)
        run: cargo clippy -p glidefs --features test-utils --tests --benches

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Test (ext4, oci-registry, oci-distribution)
        run: cargo test -p ext4 -p oci-registry -p oci-distribution --verbose
      - name: Test (glidefs)
        run: cargo test -p glidefs --features test-utils --verbose

  docker-integration:
    name: Docker Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Run docker integration tests
        run: cargo test -p glidefs --features docker-tests --test docker_integration --verbose

  integrity-suite:
    name: Data Integrity Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Run integrity suite
        run: cargo test -p glidefs --features docker-tests --test docker_integration integrity_suite -- --ignored --nocapture

  loom:
    name: Loom Concurrency Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glidefs/loom-tests
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "glidefs/loom-tests -> target"
      - name: Run loom tests
        run: cargo test --release

  stateright:
    name: Stateright Model Checking
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glidefs/stateright-model
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "glidefs/stateright-model -> target"
      - name: Run stateright model checker
        run: cargo test --release

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Run benchmarks
        run: cargo bench -p glidefs --features test-utils --benches

  blktests:
    name: blktests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install kernel modules + build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-modules-extra-$(uname -r) build-essential fio
      - name: Load kernel modules
        run: |
          sudo modprobe nbd || echo "nbd not available"
          sudo modprobe ublk_drv || echo "ublk_drv not available"
      - name: Run blktests
        run: sudo -E env "PATH=$PATH" cargo test -p glidefs --features blktests --test blktests -- --nocapture
      - name: Kernel logs (on failure)
        if: failure()
        run: sudo dmesg --color=never | tail -200

  kernel-devices:
    name: Kernel Devices (Linux)
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: "clippy"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install kernel modules + fio
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-modules-extra-$(uname -r) fio
      - name: Clippy (ublk)
        run: cargo clippy -p glidefs --features ublk,test-utils --tests --benches
      - name: Load kernel modules
        run: |
          sudo modprobe nbd || echo "nbd not available — nbd kernel tests will skip"
          sudo modprobe ublk_drv || echo "ublk_drv not available — ublk tests will skip"
      - name: fio benchmark (ublk)
        timeout-minutes: 5
        run: |
          # Build with debug info so we can decode the crash
          export CARGO_PROFILE_RELEASE_DEBUG=2
          sudo -E env "PATH=$PATH" CARGO_PROFILE_RELEASE_DEBUG=2 \
            cargo test -p glidefs --release --features fio-bench --test fio_bench --no-run 2>&1 | tail -3
          binary=$(find target/release/deps -name 'fio_bench-*' -executable | head -1)
          # Enable core dumps
          sudo sysctl -w kernel.core_pattern=/tmp/core.%e.%p
          # Run directly (not through cargo test) so core dump works with sudo
          sudo bash -c "ulimit -c unlimited; exec $binary --nocapture" &
          PID=$!
          # Wait for completion or crash (max 4 min)
          for i in $(seq 1 240); do
            if ! kill -0 $PID 2>/dev/null; then break; fi
            sleep 1
          done
          # Collect crash info
          echo "=== DMESG ==="
          sudo dmesg | grep -i "segfault\|ublk" | tail -10
          # Decode crash with addr2line
          segline=$(sudo dmesg | grep "segfault" | tail -1)
          crash_ip=$(echo "$segline" | grep -oP 'ip \K[0-9a-f]+')
          if [ -n "$crash_ip" ] && [ -n "$binary" ]; then
            echo "=== CRASH DECODE ==="
            # Get binary load address from maps (before process dies)
            sudo apt-get install -y -qq binutils gdb > /dev/null 2>&1
            # The IP is absolute. Get text base from the binary.
            text_vaddr=$(readelf -l "$binary" 2>/dev/null | grep LOAD | head -1 | awk '{print $3}')
            echo "crash_ip=0x$crash_ip text_base=$text_vaddr"
            # addr2line on the binary directly (PIE binary, so subtract load address)
            addr2line -e "$binary" -f -C "0x$crash_ip" 2>/dev/null || echo "addr2line failed"
            # Also try with objdump
            echo "=== NEARBY CODE ==="
            objdump -d -l --start-address=0x$crash_ip "$binary" 2>/dev/null | head -30
          fi
          # Try core dump
          for core in /tmp/core.*; do
            if [ -f "$core" ]; then
              echo "=== CORE BACKTRACE ==="
              gdb -batch -ex "thread apply all bt" "$binary" "$core" 2>&1 | head -150
            fi
          done
          kill $PID 2>/dev/null; wait $PID 2>/dev/null || true
          # Fail if there was a segfault
          [ -z "$crash_ip" ] || exit 1
      - name: fio verify (ublk)
        run: sudo -E env "PATH=$PATH" cargo test -p glidefs --release --features fio-bench --test fio_verify -- --nocapture
      - name: Test (ublk)
        run: cargo test -p glidefs --features ublk,test-utils --verbose
      - name: Docker integration (ublk)
        run: sudo -E env "PATH=$PATH" cargo test -p glidefs --features ublk,docker-tests --test docker_integration ublk --verbose
      - name: Filesystem crash recovery (nbd + ublk)
        run: sudo -E env "PATH=$PATH" cargo test -p glidefs --features ublk,docker-tests --test docker_integration --verbose fs_crash -- --nocapture
      - name: Kernel logs
        if: failure()
        run: sudo dmesg --color=never | tail -200

  fuzz:
    name: Fuzz Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glidefs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "glidefs -> target"
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Fuzz WAL replay
        run: cargo fuzz run fuzz_wal -- -max_total_time=30
      - name: Fuzz pack index
        run: cargo fuzz run fuzz_pack_index -- -max_total_time=30
      - name: Fuzz NBD request parsing
        run: cargo fuzz run fuzz_nbd_request -- -max_total_time=30
      - name: Fuzz NBD protocol sequence
        run: cargo fuzz run fuzz_protocol_sequence -- -max_total_time=30
      - name: Fuzz NBD client flags
        run: cargo fuzz run fuzz_nbd_client_flags -- -max_total_time=30
      - name: Fuzz NBD option header
        run: cargo fuzz run fuzz_nbd_option_header -- -max_total_time=30
      - name: Fuzz volume manifest
        run: cargo fuzz run fuzz_volume_manifest -- -max_total_time=30
      - name: Fuzz hot set
        run: cargo fuzz run fuzz_hot_set -- -max_total_time=30
      - name: Fuzz LZ4 decompress
        run: cargo fuzz run fuzz_lz4_decompress -- -max_total_time=30
