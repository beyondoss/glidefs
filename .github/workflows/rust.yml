name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glidefs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: "clippy"
      - name: Run clippy
        run: cargo clippy --features test-utils --tests --benches -- -D warnings

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glidefs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --features test-utils --verbose
      - name: Run all tests
        run: cargo test --features test-utils --verbose

  docker-integration:
    name: Docker Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glidefs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run docker integration tests
        run: cargo test --features docker-tests --test docker_integration --verbose

  loom:
    name: Loom Concurrency Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glidefs/loom-tests
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run loom tests
        run: cargo test --release

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glidefs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build benchmarks
        run: cargo build --features test-utils --benches
      - name: Run benchmarks
        run: cargo bench --features test-utils --benches

  kernel-devices:
    name: Kernel Devices (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glidefs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: "clippy"
      - name: Clippy (ublk)
        run: cargo clippy --features ublk,test-utils --tests --benches -- -D warnings
      - name: Build (ublk)
        run: cargo build --features ublk,test-utils --verbose
      - name: Test (ublk)
        run: cargo test --features ublk,test-utils --verbose
      - name: Load kernel modules
        run: |
          sudo modprobe nbd || echo "nbd not available — nbd kernel tests will skip"
          sudo modprobe ublk_drv || echo "ublk_drv not available — ublk tests will skip"
      - name: Docker integration (kernel devices)
        run: sudo -E env "PATH=$PATH" cargo test --features ublk,docker-tests --test docker_integration --verbose
