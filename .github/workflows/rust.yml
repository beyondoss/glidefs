name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: "clippy"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Clippy (ext4, oci-registry, oci-distribution)
        run: cargo clippy -p ext4 -p oci-registry -p oci-distribution --tests
      - name: Clippy (glidefs)
        run: cargo clippy -p glidefs --features test-utils --tests --benches

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Test (ext4, oci-registry, oci-distribution)
        run: cargo test -p ext4 -p oci-registry -p oci-distribution --verbose
      - name: Test (glidefs)
        run: cargo test -p glidefs --features test-utils --verbose

  docker-integration:
    name: Docker Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Run docker integration tests
        run: cargo test -p glidefs --features docker-tests --test docker_integration --verbose

  integrity-suite:
    name: Data Integrity Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Run integrity suite
        run: cargo test -p glidefs --features docker-tests --test docker_integration integrity_suite -- --ignored --nocapture

  loom:
    name: Loom Concurrency Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glidefs/loom-tests
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "glidefs/loom-tests -> target"
      - name: Run loom tests
        run: cargo test --release

  stateright:
    name: Stateright Model Checking
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glidefs/stateright-model
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "glidefs/stateright-model -> target"
      - name: Run stateright model checker
        run: cargo test --release

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Run benchmarks
        run: cargo bench -p glidefs --features test-utils --benches

  blktests:
    name: blktests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Binary-patch ublk_drv.ko (work around 1015 ublk_init_queues NULL deref)
        # linux-azure 6.17.0-1015 has a backport-order regression:
        # ublk_ctrl_add_dev() calls ublk_init_queues() *before*
        # ublk_add_tag_set(), so the new ublk_get_queue_numa_node()
        # helper reads tag_set.map[0].mq_map (NULL until
        # ublk_add_tag_set runs) and oopses the io_uring worker on every
        # UBLK_CMD_ADD_DEV. Upstream Linux has the calls in the correct
        # order (drivers/block/ublk_drv.c:4790-4794 in v6.18-rc).
        #
        # Workaround: binary-patch 2 bytes in the loaded ublk_drv.ko to
        # turn the `jb` (loop back to NULL deref) into `nop nop`, which
        # exits the CPU-search loop on the first iteration, returns
        # NUMA_NO_NODE, and lets kvzalloc_node fall back to default
        # allocation. We lose NUMA-aware queue placement on this build
        # only — same behavior as upstream pre-NUMA-patch.
        #
        # Pattern is unique in the .ko: 39 f0 72 d6
        #   39 f0 = cmp %esi,%eax    (loop bound check)
        #   72 d6 = jb -0x2a         (back to NULL deref)
        # Patch: 72 d6 → 90 90 (two NOPs, fall through to NUMA_NO_NODE).
        #
        # Drop when Ubuntu ships 6.17.0-1016+ with the call-order fix.
        run: |
          uname -r
          KO_SRC="/lib/modules/$(uname -r)/kernel/drivers/block/ublk_drv.ko.zst"
          [ -f "$KO_SRC" ] || { echo "module not at $KO_SRC"; ls /lib/modules/$(uname -r)/kernel/drivers/block/; exit 0; }
          # Ensure we don't have ublk_drv currently loaded
          sudo rmmod ublk_drv 2>/dev/null || true
          # Decompress, patch, recompress in place
          sudo zstd -d --force "$KO_SRC" -o /tmp/ublk_drv.ko
          python3 - <<'PY'
          import re, sys
          PATH = "/tmp/ublk_drv.ko"
          data = bytearray(open(PATH, "rb").read())
          # cmp %esi,%eax ; jb -0x2a
          matches = list(re.finditer(b'\x39\xf0\x72\xd6', bytes(data)))
          if len(matches) != 1:
              print(f"expected 1 match, found {len(matches)} — module may already be patched or different kernel version", file=sys.stderr)
              # Check if NOPs already there (idempotent)
              nop_pattern = list(re.finditer(b'\x39\xf0\x90\x90', bytes(data)))
              if nop_pattern:
                  print("module already patched — skipping", file=sys.stderr)
                  sys.exit(0)
              sys.exit(1)
          off = matches[0].start() + 2
          data[off:off+2] = b'\x90\x90'
          open(PATH, "wb").write(bytes(data))
          print(f"patched offset {hex(off)} (jb -> nop nop)")
          PY
          # Replace the on-disk module so modprobe picks up the patched copy
          sudo zstd --force /tmp/ublk_drv.ko -o "$KO_SRC"
          sudo depmod -a
      - name: Install kernel modules + build deps
        run: |
          sudo apt-get install -y linux-modules-extra-$(uname -r) build-essential fio
      - name: Load kernel modules
        run: |
          sudo modprobe nbd || echo "nbd not available"
          sudo modprobe ublk_drv || echo "ublk_drv not available"
      - name: Install ublk udev rule
        run: |
          sudo cp deploy/udev/99-glidefs-ublk.rules /etc/udev/rules.d/99-glidefs-ublk.rules
          sudo udevadm control --reload-rules
      - name: Run blktests
        run: sudo -E env "PATH=$PATH" cargo test -p glidefs --features blktests --test blktests -- --nocapture
      - name: Kernel logs (on failure)
        if: failure()
        run: sudo dmesg --color=never | tail -200

  ublk-transports:
    # ublk transport matrix: exercise both ZC and USER_COPY dispatch
    # paths on the same kernel. ubuntu-24.04 advertises ZC, so the
    # default-env run exercises `io_task_zero_copy`/`run_zc_queue`/
    # rotation-gate; the forced-env run exercises the legacy
    # `io_task_user_copy` fallback. A regression on either path
    # fails CI.
    name: ublk-transport-${{ matrix.transport }}
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - transport: zero-copy
            force_user_copy: ""
          - transport: user-copy
            force_user_copy: "1"
    env:
      GLIDEFS_TEST_FORCE_USER_COPY: ${{ matrix.force_user_copy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: "ublk-${{ matrix.transport }}"
      - name: Binary-patch ublk_drv.ko (work around 1015 ublk_init_queues NULL deref)
        # See blktests job for full bug analysis. Drop when 1016+ ships.
        run: |
          uname -r
          KO_SRC="/lib/modules/$(uname -r)/kernel/drivers/block/ublk_drv.ko.zst"
          [ -f "$KO_SRC" ] || { echo "module not at $KO_SRC"; ls /lib/modules/$(uname -r)/kernel/drivers/block/; exit 0; }
          sudo rmmod ublk_drv 2>/dev/null || true
          sudo zstd -d --force "$KO_SRC" -o /tmp/ublk_drv.ko
          python3 - <<'PY'
          import re, sys
          PATH = "/tmp/ublk_drv.ko"
          data = bytearray(open(PATH, "rb").read())
          matches = list(re.finditer(b'\x39\xf0\x72\xd6', bytes(data)))
          if len(matches) != 1:
              nop_pattern = list(re.finditer(b'\x39\xf0\x90\x90', bytes(data)))
              if nop_pattern:
                  print("module already patched — skipping", file=sys.stderr)
                  sys.exit(0)
              print(f"expected 1 match, found {len(matches)}", file=sys.stderr)
              sys.exit(1)
          off = matches[0].start() + 2
          data[off:off+2] = b'\x90\x90'
          open(PATH, "wb").write(bytes(data))
          print(f"patched offset {hex(off)}")
          PY
          sudo zstd --force /tmp/ublk_drv.ko -o "$KO_SRC"
          sudo depmod -a
      - name: Install kernel modules + fio
        run: |
          sudo apt-get install -y linux-modules-extra-$(uname -r) fio
      - name: Load kernel modules
        run: |
          sudo modprobe ublk_drv || echo "ublk_drv not available — ublk tests will skip"
      - name: Install ublk udev rule
        run: |
          sudo cp deploy/udev/99-glidefs-ublk.rules /etc/udev/rules.d/99-glidefs-ublk.rules
          sudo udevadm control --reload-rules
      - name: Report kernel version
        run: uname -r
      - name: zc_glidefs (${{ matrix.transport }})
        run: sudo -E env "PATH=$PATH" cargo test -p glidefs --release --features ublk,test-utils --test zc_glidefs -- --nocapture
      - name: Kernel logs (on failure)
        if: failure()
        run: sudo dmesg --color=never | tail -200

  kernel-devices:
    # Full kernel-device data-plane suite under BOTH ublk transports.
    # GitHub schedules each matrix entry as a separate runner, so the
    # two transports run in parallel — total wall-time stays at one
    # job's worth. Without this, only the `zc_glidefs` test in
    # `ublk-transports` ran against USER_COPY; fio_bench, fio_verify,
    # docker_integration, fs_crash, handoff, and the `Test (ublk)`
    # unit tests were ZC-only.
    name: Kernel Devices (${{ matrix.transport }})
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - transport: zero-copy
            force_user_copy: ""
          - transport: user-copy
            force_user_copy: "1"
    env:
      GLIDEFS_FORCE_USER_COPY: ${{ matrix.force_user_copy }}
      GLIDEFS_TEST_FORCE_USER_COPY: ${{ matrix.force_user_copy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: "clippy"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: "kernel-devices-${{ matrix.transport }}"
      - name: Binary-patch ublk_drv.ko (work around 1015 ublk_init_queues NULL deref)
        # See blktests job for full bug analysis. Drop when 1016+ ships.
        run: |
          uname -r
          KO_SRC="/lib/modules/$(uname -r)/kernel/drivers/block/ublk_drv.ko.zst"
          [ -f "$KO_SRC" ] || { echo "module not at $KO_SRC"; ls /lib/modules/$(uname -r)/kernel/drivers/block/; exit 0; }
          sudo rmmod ublk_drv 2>/dev/null || true
          sudo zstd -d --force "$KO_SRC" -o /tmp/ublk_drv.ko
          python3 - <<'PY'
          import re, sys
          PATH = "/tmp/ublk_drv.ko"
          data = bytearray(open(PATH, "rb").read())
          matches = list(re.finditer(b'\x39\xf0\x72\xd6', bytes(data)))
          if len(matches) != 1:
              nop_pattern = list(re.finditer(b'\x39\xf0\x90\x90', bytes(data)))
              if nop_pattern:
                  print("module already patched — skipping", file=sys.stderr)
                  sys.exit(0)
              print(f"expected 1 match, found {len(matches)}", file=sys.stderr)
              sys.exit(1)
          off = matches[0].start() + 2
          data[off:off+2] = b'\x90\x90'
          open(PATH, "wb").write(bytes(data))
          print(f"patched offset {hex(off)}")
          PY
          sudo zstd --force /tmp/ublk_drv.ko -o "$KO_SRC"
          sudo depmod -a
      - name: Install kernel modules + fio
        run: |
          sudo apt-get install -y linux-modules-extra-$(uname -r) fio
      - name: Clippy (ublk)
        run: cargo clippy -p glidefs --features ublk,test-utils --tests --benches
      - name: Load kernel modules
        run: |
          sudo modprobe nbd || echo "nbd not available — nbd kernel tests will skip"
          sudo modprobe ublk_drv || echo "ublk_drv not available — ublk tests will skip"
      - name: Install ublk udev rule
        run: |
          sudo cp deploy/udev/99-glidefs-ublk.rules /etc/udev/rules.d/99-glidefs-ublk.rules
          sudo udevadm control --reload-rules
      - name: Report kernel version
        run: uname -r
      - name: fio benchmark (${{ matrix.transport }})
        run: sudo -E env "PATH=$PATH" cargo test -p glidefs --release --features fio-bench --test fio_bench -- --nocapture --test-threads=1
      - name: fio verify (${{ matrix.transport }})
        run: sudo -E env "PATH=$PATH" cargo test -p glidefs --release --features fio-bench --test fio_verify -- --nocapture
      - name: Handoff durability per-PR (${{ matrix.transport }})
        run: sudo -E env "PATH=$PATH" cargo test -p glidefs --release --features ublk,fio-bench,test-fault-injection --test handoff_durability -- --ignored --nocapture handoff_durability_crh_per_pr
      - name: Handoff fault-injection grid (${{ matrix.transport }})
        run: sudo -E env "PATH=$PATH" cargo test -p glidefs --release --features ublk,fio-bench,test-fault-injection --test handoff_durability -- --ignored --nocapture handoff_fault_injection_grid_crh
      - name: Test (${{ matrix.transport }})
        run: cargo test -p glidefs --features ublk,test-utils --verbose
      - name: Docker integration (${{ matrix.transport }})
        run: sudo -E env "PATH=$PATH" cargo test -p glidefs --features ublk,docker-tests --test docker_integration ublk --verbose
      - name: Filesystem crash recovery (${{ matrix.transport }})
        run: sudo -E env "PATH=$PATH" cargo test -p glidefs --features ublk,docker-tests --test docker_integration --verbose fs_crash -- --nocapture
      - name: Kernel logs (on failure)
        if: failure()
        run: sudo dmesg --color=never | tail -200

  fuzz:
    name: Fuzz Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glidefs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "glidefs -> target"
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Fuzz WAL replay
        run: cargo fuzz run fuzz_wal -- -max_total_time=30
      - name: Fuzz pack index
        run: cargo fuzz run fuzz_pack_index -- -max_total_time=30
      - name: Fuzz NBD request parsing
        run: cargo fuzz run fuzz_nbd_request -- -max_total_time=30
      - name: Fuzz NBD protocol sequence
        run: cargo fuzz run fuzz_protocol_sequence -- -max_total_time=30
      - name: Fuzz NBD client flags
        run: cargo fuzz run fuzz_nbd_client_flags -- -max_total_time=30
      - name: Fuzz NBD option header
        run: cargo fuzz run fuzz_nbd_option_header -- -max_total_time=30
      - name: Fuzz volume manifest
        run: cargo fuzz run fuzz_volume_manifest -- -max_total_time=30
      - name: Fuzz hot set
        run: cargo fuzz run fuzz_hot_set -- -max_total_time=30
      - name: Fuzz LZ4 decompress
        run: cargo fuzz run fuzz_lz4_decompress -- -max_total_time=30
