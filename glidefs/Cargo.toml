[package]
name = "glidefs"
version = "1.0.1"
edition = "2024"
description = "High-performance NBD block storage backed by S3 for microVM storage"
license = "AGPL-3.0"
repository = "https://github.com/beyondoss/glidefs"
homepage = "https://www.glidefs.net"
documentation = "https://www.glidefs.net"
readme = "../README.md"
keywords = ["nbd", "s3", "block-storage", "microvm", "storage"]
categories = ["filesystem", "network-programming"]

[features]
default = []
tokio-console = ["dep:console-subscriber"]
# Enable test utilities (skip_recovery_for_test, etc.) for integration tests
test-utils = []
# Docker-based integration tests (testcontainers + MinIO)
docker-tests = ["test-utils"]
# Expose protocol types for fuzzing
fuzz = []
# ublk transport (Linux 6.0+ only, io_uring-based userspace block device)
ublk = ["dep:ublk-core", "dep:io-uring"]
# End-to-end fio benchmark through ublk block device
fio-bench = ["ublk", "test-utils"]
# Linux blktests suite against ublk + nbd kernel devices
blktests = ["ublk", "test-utils"]
# Loom concurrency model checking — swaps std atomics for loom atomics
# in SparseStateMap. Used by the standalone loom-tests crate.
loom = ["dep:loom"]
# Compile in fault-injection hooks for handoff state-machine tests.
# Each variant maps to an `--inject-failure=<name>` CLI flag that the
# infallible test toggles to verify the recovery paths.
test-fault-injection = []

[dependencies]
console-subscriber = { version = "0.5", optional = true }
tikv-jemallocator = "0.6"
tokio = { version = "1.49", features = ["full", "tracing"] }
tokio-util = { version = "0.7", features = ["codec", "io", "io-util"] }
hyper = { version = "1.6", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto"] }
http-body-util = "0.1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
object_store = { version = "0.12.4", features = ["aws", "azure", "gcp"] }
bytes = { version = "1.10", features = ["serde"] }
foyer = { version = "0.22", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
rand = "0.8"
futures = "0.3"
anyhow = "1.0"
url = "2.5"
deku = "0.20"
thiserror = "2.0"
libc = "0.2"
toml = "0.9"
shellexpand = "3.1"
clap = { version = "4.5", features = ["derive"] }
crossbeam = "0.8"
dashmap = "6.1"
smallvec = "1"
blake3 = "1.8"
lz4_flex = "0.12"
rayon = "1.11"
tempfile = "3.21"
parking_lot = { version = "0.12", features = ["arc_lock", "send_guard"] }
chrono = { version = "0.4.43", features = ["serde"] }
bitflags = "2"
tar = "0.4"
ext4 = { path = "../ext4" }
oci-registry = { path = "../oci-registry" }
flate2 = "1"
zstd = "0.13"
loom = { version = "0.7", optional = true }
sha2 = "0.10"
crc-fast = "1.10.0"
static_assertions = { workspace = true }
sd-notify = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
ublk-core = { path = "ublk-core", optional = true }
io-uring = { version = "0.7", optional = true }

[dev-dependencies]
tokio = { version = "1.49", features = ["test-util"] }
futures = "0.3"
criterion = { version = "0.5", features = ["async_tokio"] }
proptest = "1.4"
paste = "1"
testcontainers = "0.26"
testcontainers-modules = { version = "0.14", features = ["minio"] }

[lints]
workspace = true

[[example]]
name = "measure_footprint"
required-features = ["test-utils"]

[[bench]]
name = "flush_latency"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "workloads"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "flush_v2"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "cold_read"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "alloc_pattern"
harness = false

[[bench]]
name = "gc"
harness = false
required-features = ["test-utils"]

[[bin]]
name = "dedup_measure"
path = "src/bin/dedup_measure.rs"

[[bin]]
name = "pack_size_measure"
path = "src/bin/pack_size_measure.rs"

[[bin]]
name = "ublk_cleanup"
path = "src/bin/ublk_cleanup.rs"
required-features = ["ublk"]

[[test]]
name = "integration"
path = "tests/integration/mod.rs"
required-features = ["test-utils"]

[[test]]
name = "docker_integration"
path = "tests/docker_integration/mod.rs"
required-features = ["docker-tests"]

[[test]]
name = "fio_bench"
path = "tests/fio_bench.rs"
required-features = ["fio-bench"]

[[test]]
name = "fio_verify"
path = "tests/fio_verify.rs"
required-features = ["fio-bench"]

[[test]]
name = "zc_glidefs"
path = "tests/zc_glidefs.rs"
required-features = ["ublk", "test-utils"]

[[test]]
name = "handoff_durability"
path = "tests/handoff_durability.rs"
required-features = ["fio-bench", "ublk"]
