[package]
name = "glidefs"
version = "1.0.1"
edition = "2024"
description = "High-performance NBD block storage backed by S3 for microVM storage"
license = "AGPL-3.0"
repository = "https://github.com/paraglidehq/GlideFS"
homepage = "https://www.glidefs.net"
documentation = "https://www.glidefs.net"
readme = "../README.md"
keywords = ["nbd", "s3", "block-storage", "microvm", "storage"]
categories = ["filesystem", "network-programming"]

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true

[profile.ci]
inherits = "release"
lto = false
codegen-units = 16

[features]
default = []
tokio-console = ["dep:console-subscriber"]
# Enable test utilities (skip_recovery_for_test, etc.) for integration tests
test-utils = []
# Docker-based integration tests (testcontainers + MinIO)
docker-tests = ["test-utils"]
# Expose protocol types for fuzzing
fuzz = []
# ublk transport (Linux 6.0+ only, io_uring-based userspace block device)
ublk = ["dep:libublk", "dep:smol", "dep:io-uring"]

[dependencies]
console-subscriber = { version = "0.5", optional = true }
mimalloc = { version = "0.1", features = ["v3"] }
tokio = { version = "1.49", features = ["full", "tracing"] }
tokio-util = { version = "0.7", features = ["codec"] }
hyper = { version = "1.6", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto"] }
http-body-util = "0.1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
object_store = { version = "0.12.4", features = ["aws", "azure", "gcp"] }
bytes = { version = "1.10", features = ["serde"] }
foyer = { version = "0.22", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
rand = "0.8"
futures = "0.3"
anyhow = "1.0"
url = "2.5"
deku = "0.20"
thiserror = "2.0"
libc = "0.2"
uuid = { version = "1.17", features = ["v4"] }
toml = "0.9"
shellexpand = "3.1"
clap = { version = "4.5", features = ["derive"] }
crossbeam = "0.8"
dashmap = "6.1"
redb = "2"
blake3 = "1.8"
lz4_flex = "0.12"
crc32fast = "1.5"
rayon = "1.11"
tempfile = "3.21"
parking_lot = "0.12"
chrono = { version = "0.4.43", features = ["serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
libublk = { git = "https://github.com/paraglidehq/libublk-rs.git", branch = "fix/serde-blk-zone", optional = true }
smol = { version = "2", optional = true }
io-uring = { version = "0.7", optional = true }

[dev-dependencies]
tokio = { version = "1.49", features = ["test-util"] }
futures = "0.3"
criterion = { version = "0.5", features = ["async_tokio"] }
proptest = "1.4"
paste = "1"
testcontainers = "0.26"
testcontainers-modules = { version = "0.14", features = ["minio"] }

[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[lints.rust]
# Allow loom and ublk cfg flags
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[lints.clippy]
# Real bugs — deny in CI
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
# Style/pedantic — warn locally, don't block CI
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }

[[bench]]
name = "flush_latency"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "workloads"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "flush_v2"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "cold_read"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "manifest_serde"
harness = false

[[bin]]
name = "dedup_measure"
path = "src/bin/dedup_measure.rs"

[[bin]]
name = "pack_size_measure"
path = "src/bin/pack_size_measure.rs"

[[test]]
name = "integration"
path = "tests/integration/mod.rs"
required-features = ["test-utils"]

[[test]]
name = "docker_integration"
path = "tests/docker_integration/mod.rs"
required-features = ["docker-tests"]

