[package]
name = "glidefs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
deku = "0.20"
tempfile = "3"

[dependencies.glidefs]
path = ".."
features = ["fuzz"]

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "fuzz_nbd_client_flags"
path = "fuzz_targets/fuzz_nbd_client_flags.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_nbd_option_header"
path = "fuzz_targets/fuzz_nbd_option_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_nbd_request"
path = "fuzz_targets/fuzz_nbd_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_protocol_sequence"
path = "fuzz_targets/fuzz_protocol_sequence.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_pack_index"
path = "fuzz_targets/fuzz_pack_index.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_wal"
path = "fuzz_targets/fuzz_wal.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_volume_manifest"
path = "fuzz_targets/fuzz_volume_manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_hot_set"
path = "fuzz_targets/fuzz_hot_set.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decompress_block"
path = "fuzz_targets/fuzz_decompress_block.rs"
test = false
doc = false
bench = false
