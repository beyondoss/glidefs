[package]
name = "glidefs-kernels"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "GlideFS's pure decision kernels: no I/O, no clock, proven with Verus"

[lib]
name = "glidefs_kernels"

[features]
default = []
# Mutations of the snapshot-owner decisions (`snapshot_owner`): `cargo verus verify --features mut_x` (see
# `scripts/verify-kernels.sh`) must go red under each, and the named glidefs test must fail.
# `list_snapshots_owned` lists every owner's markers: router `test_owned_snapshot_is_listed_by_owner_and_idempotent`.
mut_list_ignores_owner = []
# A bare marker (a cut that crashed before its manifest) answers a retry: router `test_owner_marker_without_manifest_is_listed_and_clears`.
mut_retry_answers_bare_marker = []
# A retry answers the lowest manifested sequence, not the highest: router `test_retry_answers_the_highest_manifested_sequence`.
mut_retry_answers_lowest = []
# `next_value` wraps to zero at u64::MAX: glidefs `block_map::tests::sequence_number_never_wraps`.
mut_counter_wraps = []
# A closed tag is cut anyway: glidefs `test_a_closed_owner_refuses_a_late_cut`.
mut_closed_tag_still_cuts = []
# A closed marker is removable at any age: glidefs `test_a_closed_marker_is_removed_only_when_older_than_the_request_bound`.
mut_closed_marker_removed_early = []
# An owned cut older than the request bound writes its marker and manifest anyway: glidefs `test_an_expired_owned_cut_writes_nothing`.
mut_expired_cut_writes = []
# Every object-store config is admitted at startup: glidefs `parse_object_store::slack_tests::a_store_config_that_breaks_the_slack_is_refused`.
mut_store_config_unchecked = []

# A delete leaves the markers of its sequence: `ContentStore::delete_snapshot` (router `test_deleting_a_snapshot_drops_its_owner_markers`).
mut_delete_keeps_markers = []
# A delete removes only the first owner's marker of its sequence.
mut_delete_one_owner = []

# A restarted export's counter ignores the store's cut sequences: glidefs `block::router::tests::test_a_relocated_export_cuts_above_every_earlier_cut`.
mut_seed_ignores_store = []

# The attach fence admits every token: glidefs `block::fence::tests::a_stale_generation_is_refused_whatever_its_revision`.
mut_attach_admits_older = []
# The revision takes the token's high bits: the same test.
mut_token_revision_dominates = []
# A granted attach leaves the stored (lower) token as the volume's holder: Verus only (`attach_seize`).
mut_seize_stamps_the_lower = []
# `detach_kernel`: a detach reports before the device is drained (the remaining count is taken as 0): Verus only.
mut_detach_reports_before_flush = []
# A drain pass with blocks still syncing ends the drain; a failed final manifest sync owes nothing: Verus only (`detach_kernel`).
mut_drained_ignores_syncing = []
mut_detach_ignores_the_final_sync = []
mut_export_leaves_before_the_final_sync = []

# A SYNCING block is evicted whether or not the manifest names it: Verus red on `flush_kernel::step`.
mut_evict_before_manifest = []
# A write to a SYNCING block leaves it SYNCING (the eviction drops the newer content): the same.
mut_write_keeps_syncing = []

# An export whose definition is saved is kept whether or not its device is registered: Verus red on `attach_kernel::attach_fate`.
mut_attach_keeps_deviceless = []
# A registration still running when the attach is dropped counts as registered at the guard's decision: Verus red on `attach_kernel::lemma_every_registration_event_keeps_the_invariant`.
mut_drop_counts_inflight_registration = []

# A named pack past its grace period is reclaimed; only snapshots name a pack: Verus red on `pack_liveness::pack_verdict`.
mut_gc_reclaims_named = []
mut_gc_ignores_manifests = []

# A stranded SYNCING block (flush and SSD copy both failed) is marked NOT_PRESENT: Verus red on `flush_kernel::step`.
mut_stranded_marked_absent = []

# A step of an owned cut is enabled without its hold of the export's flush lock: Verus red on `cut_hold::lemma_every_event_keeps_the_invariant`.
mut_cut_steps_skip_the_lock = []

# The closed marker's keep age leaves out the clock skew of reading S3's `last_modified` against GlideFS's clock: Verus red on `snapshot_owner::a_removed_closed_marker_has_no_late_cut_to_stop`.
mut_keep_omits_clock_skew = []

# The purge gate admits every key, a pack's included: Verus red on `purge_gate::not_a_pack`.
mut_purge_gate_admits_packs = []

# The recovered counters are the deltas of the load, not the final phases: Verus red on `block_counters::recount`; glidefs `block::write_cache::tests::a_restart_counts_the_dirty_blocks_the_metadata_holds`.
mut_count_by_deltas = []

# A pass that skipped blocks a write race explains publishes the manifest: Verus red on `cut_publish::pass_verdict`.
mut_cut_publishes_with_skips = []
# A pass that never rotated (it flushed nothing) publishes the manifest: Verus red on `cut_publish::pass_verdict`.
mut_cut_ignores_blocked_flush = []

# A cut whose snapshot index entry was not saved is reported persisted: Verus red on `snapshot_objects::snapshot_reported`.
mut_report_without_index = []

[dependencies]
# The `verus!` macro and the spec library. A normal build erases every proof; only a `cargo verus` build checks them.
vstd = "=0.0.0-2026-11-01-0251"

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)'] }
