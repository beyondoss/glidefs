[package]
name = "oci-registry"
version = "0.1.0"
edition = "2024"

[dependencies]
oci-client = { version = "0.16", default-features = false, features = ["rustls-tls"] }
oci-spec = "0.8"
thiserror = "2"
tokio = { version = "1" }
tracing = "0.1"
futures = "0.3"
bytes = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
