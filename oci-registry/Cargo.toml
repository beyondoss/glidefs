[package]
name = "oci-registry"
version = "0.1.0"
edition = "2024"

[dependencies]
oci-client = { version = "0.16", default-features = false, features = ["native-tls"] }
# Vendor OpenSSL so cross-compilation works without system libssl-dev.
openssl = { version = "0.10", features = ["vendored"] }
thiserror = "2"
tokio = { version = "1" }
tracing = "0.1"
futures = "0.3"
bytes = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
